[build-system]
# setuptools>=77 is the first release that accepts `license` as an SPDX expression
# (PEP 639); below it the build prints a deprecation warning and the table form is the
# only option.  The deadline for the old form is 2027-02-18.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "firmprint"
version = "0.1.0"
description = "Evidence-backed firmware identification for Cortex-M images: every claim carries the offset and bytes that produced it"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# LICENSE is ours.  NOTICE.md is the licence story of the *verification samples*, and a wheel
# is the one artifact a reader gets without a checkout -- shipping only LICENSE would hand over
# the MIT part and keep the part that says those firmware images are somebody else's build
# artifacts, with no root LICENSE upstream to point at, in a file nobody installed.
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["firmware", "reverse-engineering", "cortex-m", "stm32", "embedded",
            "dfir", "vector-table", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Embedded Systems",
    "Typing :: Typed",
]

# Zero required dependencies: a forensics tool that cannot install because of a
# transitive wheel is a tool nobody runs on an incident machine.
dependencies = []

[project.optional-dependencies]
# Turns "the constant 0x40011000 is somewhere in the image" into
# "HAL_UART_Init stores to USART1+CR1". Absent, the scan still runs.
capstone = ["capstone>=5.0.1"]
dev = ["pytest>=7", "ruff>=0.4", "capstone>=5.0.1"]

[project.scripts]
firmprint = "firmprint.cli:main"

[project.urls]
Homepage = "https://github.com/xuange-hu/firmprint"
Verification = "https://github.com/xuange-hu/firmprint/blob/main/verification/openmv2.md"
"Security & dual-use" = "https://github.com/xuange-hu/firmprint/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
firmprint = ["data/*.json", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# E501: the report prose is written to read well in a terminal, not to a column.
# SIM105: `try/except/pass` reads better than a contextlib wrapper for the optional-import guard.
ignore = ["E501", "SIM105"]

[tool.pytest.ini_options]
# Deliberately empty.  `-q` here used to double with the `-q` in the README and CI command,
# and pytest reads two of them as "show no summary line" -- so the documented way to run the
# suite printed 277 dots and never said 277, which is a claim the docs could not show.
addopts = ""
testpaths = ["tests"]
