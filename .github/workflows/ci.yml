name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    # The dependency-free path: this must pass on a machine that refused to install
    # capstone, because that is the install a forensics box actually gets.
    name: py${{ matrix.python }} / ${{ matrix.os }} / capstone=${{ matrix.capstone }}
    runs-on: ${{ matrix.os }}
    # Without this, a `run:` block on windows-latest is PowerShell, and PowerShell does
    # not stop a script when a command in the middle of it fails -- it keeps going and
    # the step's exit code is whatever the *last* line returned.  That turns every check
    # before the last line into a check that can fail silently, which is the one thing a
    # gate must not do.  bash is the shell that aborts (`-e`), on all three platforms.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
        capstone: ["with", "without"]
        exclude:
          # one macOS runner is enough for a pure-Python package; the matrix is
          # about interpreter × platform, not about burning three runners per commit
          - os: macos-latest
            capstone: "without"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (no extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff

      - name: Add capstone
        if: matrix.capstone == 'with'
        run: python -m pip install "capstone>=5.0.1"

      - name: Lint
        run: python -m ruff check src tools tests

      - name: Confirm the optional dependency really is optional
        run: python -c "import importlib.util,sys;sys.exit(0 if importlib.util.find_spec('capstone') is None else 1)"
        if: matrix.capstone == 'without'

      - name: Tests (samples absent -> sample tests skip, the rest must pass)
        run: python -m pytest -q

      - name: MCP server self-test
        run: python -m firmprint mcp --self-test

      - name: Stdlib scan must still answer on a synthetic image
        # `tools/make_synthetic.py` is the same file a reader uses before downloading a
        # sample, so this job proves the dependency-free path works without a network.
        # The report goes to disk through `--json`, not a shell redirect: the CLI writes it
        # as UTF-8 explicitly, whereas `>` hands the bytes to whatever the runner's stdout
        # encoding happens to be, and then the reader has to guess.
        run: |
          python tools/make_synthetic.py blob.bin --print-summary
          python -m firmprint scan blob.bin --no-code --json out.json
          python -c "import json;c=json.load(open('out.json',encoding='utf-8'))['contract'];assert not c['violations'],c"
          python -m firmprint scan blob.bin --no-code --strict

  packaging:
    # Every other job here installs with `pip install -e .`, which imports the package
    # straight out of `src/`.  An editable install is blind to packaging mistakes: if
    # `data/*.json` or `py.typed` stopped being copied into the distribution, all of them
    # would stay green while the wheel a reader downloads cannot name a single peripheral.
    # This job installs the artifact instead of the source tree, offline, and runs it from
    # a directory that is not the checkout -- so it also catches a module that reads its
    # data files by a path relative to the repository.
    name: install the built wheel, offline, outside the checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel with --no-index
        # `--no-index` turns the zero-dependency promise into an exit code: if a runtime
        # requirement were real, resolving it without an index would fail right here.
        # The venv goes to `$RUNNER_TEMP`, not the checkout, so nothing below can accidentally
        # import from `src/` and mistake that for the installed package.
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-index "$GITHUB_WORKSPACE"/dist/firmprint-*.whl

      - name: The installed package must answer without the checkout, capstone, or a network
        run: |
          PY="$RUNNER_TEMP/venv/bin/python"
          FP="$RUNNER_TEMP/venv/bin/firmprint"
          # the generator is a repo tool, deliberately not part of the package; the scanner
          # under test is the installed one
          "$PY" "$GITHUB_WORKSPACE/tools/make_synthetic.py" blob.bin
          "$FP" --version
          test -n "$("$FP" socdb list)"                     # data/*.json really shipped
          test "$("$FP" socdb list | grep -c '^stm32')" -eq 3
          "$FP" scan blob.bin --no-code --strict
          "$FP" scan blob.bin --no-code --json out.json
          "$PY" -c "import json;c=json.load(open('out.json',encoding='utf-8'))['contract'];assert not c['violations'],c"
          "$PY" -m firmprint mcp --self-test
          "$PY" -c "import importlib.util,sys;sys.exit(0 if importlib.util.find_spec('capstone') is None else 1)"
          test "$("$PY" -m pip freeze | wc -l)" -eq 1       # the wheel, and nothing else
        working-directory: ${{ runner.temp }}

  verification:
    # The answer key.  Needs the samples, so it is the one job that talks to GitHub
    # releases -- and it rewrites nothing, it only diffs.
    name: verification documents (real firmware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with capstone
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[capstone]"

      - name: Fetch pinned MIT-licensed samples
        run: python tools/get_sample.py --all

      - name: Score against the image's own symbols (both boards)
        # `--strict` is what makes this a gate: `verify` prints the violation count
        # either way, and without the flag an untrustworthy report still exited 0.
        # Actions runs a multiline `run:` with `bash -e -o pipefail`, so `| tail -20`
        # cannot swallow the exit code -- the pipeline fails with the program.
        run: |
          python -m firmprint verify samples/openmv2/firmware.elf --strict | tail -20
          python -m firmprint verify samples/openmv3/firmware.elf --strict | tail -20

      - name: Strict scans must fail closed on zero violations
        run: |
          for f in samples/openmv2/firmware.bin samples/openmv3/firmware.bin samples/openmv2/openmv.bin samples/openmv3/openmv.bin; do
            python -m firmprint scan "$f" --strict > /dev/null || exit 1
            echo "ok: $f"
          done

      - name: Quoted report lines in the prose must match live output
        # README.md and docs/case-*.md paste real rows.  Re-scanning every fetched
        # sample here is what stops a heuristic fix from leaving a stale number in
        # the documentation -- the one failure mode this project cannot afford.
        run: python tools/check_doc_quotes.py

      - name: Regenerate the verification documents and diff
        run: |
          python tools/make_verification.py
          # These documents are machine-generated, so a PR that moves a number has to
          # carry the regenerated file.  Two things in them are properties of the runner
          # rather than of the answer key and are normalised away before comparing:
          # wall-clock timings, and the version the disassembler library self-reports
          # (capstone's 5.0.9 wheel still prints `capstone/5.0.7`).
          : > verification.diff
          for f in openmv2 openmv3; do
            for side in HEAD worktree; do
              if [ "$side" = HEAD ]; then
                git show "HEAD:verification/$f.md"
              else
                cat "verification/$f.md"
              fi | sed -E 's/^- runtimes:.*/- runtimes: (runner)/;
                          s/capstone\/[0-9][0-9a-z.+-]*/capstone\/VERSION/g' \
                 | tr -s ' \t' ' ' > "/tmp/$f.$side"
            done
            diff -u "/tmp/$f.HEAD" "/tmp/$f.worktree" >> verification.diff || true
          done
          if [ -s verification.diff ]; then
            echo "::error::verification/*.md changed -- commit the regenerated documents (see CONTRIBUTING.md)"
            head -80 verification.diff
            exit 1
          fi
          echo "verification documents reproduce (modulo timings and the capstone version string)"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-diff
          path: verification.diff
          if-no-files-found: ignore
